[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oplata"
version = "0.20.1"
description = "Оплаты — Строймаркет (Windows-программа учёта поставок, долгов и оплат)"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.7,<7", "openpyxl>=3.1,<4"]

[project.scripts]
oplata = "oplata.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
