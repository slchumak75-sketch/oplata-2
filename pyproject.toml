[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oplata"
version = "0.2.0"
description = "Оплаты — Строймаркет (Windows, оболочка по макетам; формулы — следующим этапом)"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.7,<7"]

[project.scripts]
oplata = "oplata.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
