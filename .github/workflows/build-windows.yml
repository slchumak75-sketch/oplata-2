# Автосборка Windows-приложения «Оплаты — Строймаркет».
#
# Быстрый режим (ADR-013):
#   * push в main или arena/**, pull request -> тесты + folder-сборка;
#   * push тега v* -> folder + single-file + публикация GitHub Release;
#   * вручную: Actions -> Build Windows -> Run workflow
#     (опция build_single добавляет single-file и без тега).
#
# Варианты:
#   * Oplata-windows-folder-v...      — рекомендуемый, собирается всегда:
#     папка Oplata (PyInstaller onedir, без самораспаковки);
#   * Oplata-windows-single-file-v... — запасной: один Oplata.exe
#     (PyInstaller onefile), только для релизов/ручного запуска с опцией.
#
# Где скачать: вкладка Actions -> нужный запуск -> Artifacts,
# а для тегов — раздел Releases. Подробности: docs/BUILD.md

name: Build Windows

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      build_single:
        description: "Также собрать запасной пакет одним файлом"
        type: boolean
        required: false
        default: false

permissions:
  contents: write # нужно только шагу публикации Release на тегах v*

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux, headless Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Библиотеки, без которых PySide6 не стартует даже в offscreen-режиме
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1

      # PyInstaller тестам не нужен: не ставим requirements-dev целиком.
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pytest>=8,<9"

      # v0.88.1: та же проверка, что и в Windows-сборке — версии Qt и
      # shiboken обязаны совпадать и совпадать с закреплённой.
      - name: Verify Qt version matches the pin
        run: |
          python - <<'PY'
          import re, sys, PySide6, shiboken6
          print("PySide6:", PySide6.__version__, "shiboken6:", shiboken6.__version__)
          assert PySide6.__version__ == shiboken6.__version__, "версии PySide6 и shiboken6 разные"
          pinned = re.search(r"^PySide6-Essentials==(\S+)", open("requirements.txt").read(), re.M).group(1)
          assert PySide6.__version__ == pinned, f"поставлен {PySide6.__version__}, закреплён {pinned}"
          print("Qt версия совпадает с закреплённой:", pinned)
          PY

      # Частями (scripts/run_tests.sh): один длинный процесс с десятками
      # Qt-окон в offscreen-режиме может не дойти до конца прогона.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          TEST_PARTS: "4"
        run: bash scripts/run_tests.sh

  build-windows:
    name: Build Windows packages
    needs: test
    runs-on: windows-latest
    env:
      # Обычные ветки: только быстрый рекомендуемый folder-пакет.
      # Single — релизные теги и ручной запуск с галочкой build_single.
      BUILD_SINGLE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.build_single }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pyinstaller>=6,<7"

      # v0.88.1: проверяем, что Qt и shiboken одной версии и что это та
      # версия, которая закреплена в requirements.txt. Смесь двух версий
      # в сборке даёт у пользователя «Не найдена указанная процедура».
      - name: Verify Qt version matches the pin
        shell: pwsh
        run: |
          $pyside = python -c "import PySide6; print(PySide6.__version__)"
          $shiboken = python -c "import shiboken6; print(shiboken6.__version__)"
          Write-Host "PySide6: $pyside, shiboken6: $shiboken"
          if ($pyside -ne $shiboken) {
            throw "PySide6 ($pyside) и shiboken6 ($shiboken) разных версий — сборка не запустится"
          }
          $pinned = (Select-String -Path requirements.txt -Pattern '^PySide6-Essentials==(\S+)').Matches[0].Groups[1].Value
          if ($pyside -ne $pinned) {
            throw "Поставлен PySide6 $pyside, а закреплён $pinned — проверьте requirements.txt"
          }
          Write-Host "Qt версия совпадает с закреплённой: $pinned"

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0, 'src'); import oplata; print(oplata.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Oplata version: $v"

      - name: Generate Windows version metadata
        shell: pwsh
        run: |
          python scripts/write_version_info.py
          if ($LASTEXITCODE -ne 0) { throw "Version metadata generation failed" }
          Get-Content ".\build\version_info.txt"

      - name: Build folder package (recommended)
        shell: pwsh
        env:
          OPLATA_PACKAGE_MODE: folder
        run: |
          pyinstaller --noconfirm --clean oplata.spec
          if ($LASTEXITCODE -ne 0) { throw "Folder build failed, exit code $LASTEXITCODE" }

          $exe = ".\dist\Oplata\Oplata.exe"
          if (-not (Test-Path $exe)) { throw "Folder build did not create $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Folder smoke test failed, exit code $($p.ExitCode)" }
          Write-Host "Folder smoke test OK"


          New-Item -ItemType Directory -Force ".\package-folder" | Out-Null
          Copy-Item ".\dist\Oplata" ".\package-folder\Oplata" -Recurse -Force
          Copy-Item ".\packaging\START_HERE_RU.txt" ".\package-folder\START_HERE_RU.txt"
          Copy-Item ".\packaging\Start-With-Google-Drive.bat" ".\package-folder\Start-With-Google-Drive.bat"
          Remove-Item ".\dist" -Recurse -Force

          # Smoke-тест именно того, что уходит в артефакт: раньше
          # проверялся dist\Oplata, а пользователю достаётся копия из
          # package-folder. Плюс считаем файлы — по числу видно, полная
          # ли папка (внутри должна быть _internal с DLL).
          $packed = ".\package-folder\Oplata\Oplata.exe"
          if (-not (Test-Path $packed)) { throw "package-folder does not contain $packed" }
          $files = Get-ChildItem -Path ".\package-folder" -Recurse -File
          $p2 = Start-Process -FilePath $packed -ArgumentList "--self-test" -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "Packed smoke test failed, exit code $($p2.ExitCode)" }
          Write-Host "Packed smoke test OK, files: $($files.Count)"

      - name: Build single-file package (fallback; tags/manual only)
        if: env.BUILD_SINGLE == 'true'
        shell: pwsh
        env:
          OPLATA_PACKAGE_MODE: single
        run: |
          pyinstaller --noconfirm --clean oplata.spec
          if ($LASTEXITCODE -ne 0) { throw "Single-file build failed, exit code $LASTEXITCODE" }

          $exe = ".\dist\Oplata.exe"
          if (-not (Test-Path $exe)) { throw "Single-file build did not create $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Single-file smoke test failed, exit code $($p.ExitCode)" }
          Write-Host "Single-file smoke test OK"

          New-Item -ItemType Directory -Force ".\package-single" | Out-Null
          Copy-Item $exe ".\package-single\Oplata.exe"
          Copy-Item ".\packaging\START_HERE_RU.txt" ".\package-single\START_HERE_RU.txt"
          Copy-Item ".\packaging\Start-With-Google-Drive.bat" ".\package-single\Start-With-Google-Drive.bat"

      - name: Verify EXE metadata and record SHA-256
        shell: pwsh
        run: |
          $expectedVersion = "${{ steps.version.outputs.version }}"
          $executables = @(".\package-folder\Oplata\Oplata.exe")
          $singleExe = ".\package-single\Oplata.exe"
          if (Test-Path $singleExe) {
            $executables += $singleExe
          }

          foreach ($exe in $executables) {
            $info = (Get-Item $exe).VersionInfo
            Write-Host "$exe"
            Write-Host "  ProductName=$($info.ProductName)"
            Write-Host "  FileDescription=$($info.FileDescription)"
            Write-Host "  FileVersion=$($info.FileVersion)"
            Write-Host "  ProductVersion=$($info.ProductVersion)"
            if ($info.FileVersion -ne $expectedVersion -or $info.ProductVersion -ne $expectedVersion) {
              throw "Unexpected EXE version metadata in $exe (expected $expectedVersion)"
            }
            if ([string]::IsNullOrWhiteSpace($info.ProductName) -or [string]::IsNullOrWhiteSpace($info.FileDescription)) {
              throw "Missing EXE product metadata in $exe"
            }
          }

          $summary = @(
            "## Oplata v$expectedVersion — Windows packages",
            "",
            "| File | SHA-256 |",
            "|---|---|"
          )
          foreach ($exe in $executables) {
            $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            $summary += "| ``$exe`` | ``$hash`` |"
            Write-Host "SHA256 $hash  $exe"
          }
          $summary | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # v0.87.0: установщик ставит программу целиком (без ZIP-распаковки,
          # из-за которой терялся Oplata.exe), без прав администратора.
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { Write-Host "choco returned $LASTEXITCODE, looking for existing Inno Setup" }

          # Ищем ISCC.exe в любом месте установки (6.x, 6.3, 6.4, ...).
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe", "C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                     Select-Object -First 1).FullName
          }
          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw "Inno Setup not found after choco install" }
          Write-Host "ISCC: $iscc"

          # ВАЖНО: Inno Setup считает относительные пути ОТ ПАПКИ СКРИПТА
          # (packaging\), поэтому BuildDir передаём абсолютным путём —
          # иначе он ищет packaging\.\package-folder и падает с
          # «No files found matching ...».
          $buildDir = (Resolve-Path ".\package-folder").Path
          if (-not (Test-Path "$buildDir\Oplata\Oplata.exe")) {
            throw "package-folder is incomplete: $buildDir\Oplata\Oplata.exe not found"
          }
          Write-Host "BuildDir: $buildDir"
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DBuildDir=$buildDir" ".\packaging\Oplata.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed, ISCC exit code $LASTEXITCODE" }
          $setup = Get-ChildItem ".\installer\*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer was not produced" }
          Write-Host "Installer: $($setup.FullName) ($([math]::Round($setup.Length/1MB,1)) MB)"

      - name: Pack update ZIP (для обновления через Google Диск)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Формат файла обновления (см. src/oplata/updates.py):
          #   Oplata-<версия>-Update.zip
          #     oplata-update.json  — манифест: версия, имя установщика, SHA-256
          #     Oplata-<версия>-Setup.exe
          # Остальные компьютеры читают сначала маленький манифест и
          # ставят обновление только по подтверждению.
          $version = $env:APP_VERSION
          $setup = (Get-ChildItem ".\installer\*.exe" | Select-Object -First 1).FullName
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $stamp = Get-Date -Format "yyyy-MM-dd"
          $manifest = [ordered]@{
            version = $version
            setup   = (Split-Path $setup -Leaf)
            sha256  = $sha
            built   = $stamp
            format  = 1
          }
          $manifest | ConvertTo-Json | Set-Content ".\installer\oplata-update.json" -Encoding UTF8
          $updateZip = "Oplata-$version-Update.zip"
          Compress-Archive -Path ".\installer\*.exe", ".\installer\oplata-update.json" `
            -DestinationPath $updateZip -Force
          "UPDATE_ZIP=$updateZip" >> $env:GITHUB_ENV
          Write-Host "Update ZIP: $updateZip"

      - name: Prepare release ZIP files and checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $folderZip = "Oplata-v$version-windows-folder.zip"
          $singleZip = "Oplata-v$version-windows-single-file.zip"
          # v0.87.0: установщик — основной способ поставить программу.
          $setupExe = "Oplata-$version-Setup.exe"
          Copy-Item (Get-ChildItem ".\installer\*.exe" | Select-Object -First 1).FullName $setupExe

          Compress-Archive -Path ".\package-folder\*" -DestinationPath $folderZip
          Compress-Archive -Path ".\package-single\*" -DestinationPath $singleZip

          $checksums = foreach ($file in @($folderZip, $singleZip, $setupExe, $env:UPDATE_ZIP)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $checksums | Set-Content "SHA256SUMS.txt" -Encoding ascii
          Get-Content "SHA256SUMS.txt"

          "FOLDER_ZIP=$folderZip" >> $env:GITHUB_ENV
          "SINGLE_ZIP=$singleZip" >> $env:GITHUB_ENV

      # Upload directories directly: GitHub creates exactly one downloadable
      # ZIP for each artifact, without our old ZIP-inside-ZIP nesting.
      - name: Upload folder artifact (recommended)
        uses: actions/upload-artifact@v4
        with:
          name: Oplata-windows-folder-v${{ steps.version.outputs.version }}
          path: package-folder/**
          if-no-files-found: error

      - name: Upload single-file artifact (fallback)
        if: env.BUILD_SINGLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Oplata-windows-single-file-v${{ steps.version.outputs.version }}
          path: package-single/**
          if-no-files-found: error

      - name: Publish GitHub Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.FOLDER_ZIP }}
            ${{ env.SINGLE_ZIP }}
            ${{ env.UPDATE_ZIP }}
            Oplata-*-Setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
